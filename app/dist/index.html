かくは1時間に「速さの差」ずつ広がります。だから、広がった道のりを時間で割れば速さの差です。","equation":"24÷4＝6（km/時）"},{"id":"s3","title":"Bの時速を出す","body":"AのほうがBより速く、その差が時速6kmです。","equation":"48−6＝42（km/時）"},{"id":"s4","title":"確かめる","body":"4時間でAは192km、Bは168km進み、差は24kmです。","equation":"48×4−42×4＝24","checkpoint":{"prompt":"2台の間かくは1時間に何kmずつ広がりますか。","answer":{"n":"6","d":"1","unit":"km","dimension":"length"}}}]},"selectionKey":"T02/speed.chase.same-direction"},{"id":"ready-5067410d8c260cf1","unitId":"selection.T03.全所要時間逆比と先行区間","category":"oneline","domain":"速さ","text":"コウジ君は8時にA町を出て、8時36分にB町に着きました。マサト君は7時57分にB町を出て、8時45分にA町に着きました。途中、A町から1800mのところで、2人は出会いました。\n(1) コウジ君とマサト君の速さの比を求めなさい。\n(2) 8時から2人が出会うまでの間にマサト君は何m歩きましたか。\n(3) マサト君の分速を求めなさい。\n(4) A町とB町の間の距離は何mですか。","source":{"title":"GW518-26② 1,2,3,4","url":"https://app.notion.com/3f42b010743c8197a63bce6541369a43","locator":"Notion 指定小問 1,2,3,4","sourceText":"コウジ君は8時にA町を出て、8時36分にB町に着きました。マサト君は7時57分にB町を出て、8時45分にA町に着きました。途中、A町から1800mのところで、2人は出会いました。\n(1) コウジ君とマサト君の速さの比を求めなさい。\n(2) 8時から2人が出会うまでの間にマサト君は何m歩きましたか。\n(3) マサト君の分速を求めなさい。\n(4) A町とB町の間の距離は何mですか。","sourceAnswer":"(1) 4:3　(2) 1350m　(3) 分速70m　(4) 3360m","verification":"本文条件から作成者と検算者が別々に解き、資料の答えと一致を確認。"},"answer":{"parts":[{"label":"(1)","dimension":"ratio","terms":["4","3"],"unit":""},{"label":"(2)","n":"1350","d":"1","unit":"m","dimension":"length"},{"label":"(3)","n":"70","d":"1","unit":"m/分","dimension":"speed"},{"label":"(4)","n":"3360","d":"1","unit":"m","dimension":"length"}]},"difficulty":5,"figureRequired":false,"scopeUnits":["GW518"],"homeStudy":false,"reviewEligible":false,"expeditionOnly":true,"revision":1,"explanation":{"steps":[{"id":"s1","title":"かかった時間を整理する","body":"コウジ君はA町からB町まで36分、マサト君はB町からA町まで48分かかりました。同じ道のりなので、速さの比は時間の逆の比です。","equation":"36：48＝3：4→速さの比4：3"},{"id":"s2","title":"8時からは同じ時間だけ歩く","body":"8時から出会うまで、2人は同じ時間歩いています。同じ時間なら道のりの比は速さの比4：3です。","equation":"1800×3÷4＝1350（m）"},{"id":"s3","title":"マサト君の先に歩いた分を考える","body":"マサト君は8時までに3分先に歩いています。全体の道のりは、マサト君の48分ぶんであり、1800＋1350＋3分ぶんでもあります。","equa ":"s3","title":"はじめの差を出す","body":"時速28kmで追うと1時間に28−24＝4kmずつ近づき、3時間で追いつきます。","equation":"（28−24）×3＝12（km）"},{"id":"s4","title":"時速34kmのときの時間","body":"時速34kmなら1時間に34−24＝10km近づきます。12km近づくのにかかる時間を求めます。","equation":"12÷10＝1.2（時間）＝1時間12分"},{"id":"s5","title":"確かめる","body":"時速30kmでも（30−24）×2＝12kmで、はじめの差が同じになり、条件に合います。","equation":"（30−24）×2＝12","checkpoint":{"prompt":"時速34kmで追いかけるとき、車は1時間に何kmずつバスに近づきますか。","answer":{"n":"10","d":"1","unit":"km","dimension":"length"}}}]},"selectionKey":"T04/speed.chase.two-options.infer-target-and-gap"},{"id":"ready-c30aed8fbb87896a","unitId":"selection.T05.speed.three-people.two-meeting-times-infer-common-rate","category":"oneline","domain":"速さ","text":"A、B、Cが池の周りを1周します。3人は同じ地点から同時に歩き始めましたが、Cだけ逆の方向に進みました。Aは分速90m、Bは分速65mです。出発してから32分後にAとCが出会い、その5分後にBとCが出会いました。Cの速さと、この池の周りの長さを求めなさい。","source":{"title":"R20N⑦-2","url":"https://app.notion.com/3f42b010743c810aa7b8c1b8fa0c653e","locator":"Notion 全体","sourceText":"A、B、Cが池の周りを1周します。3人は同じ地点から同時に歩き始めましたが、Cだけ逆の方向に進みました。Aは分速90m、Bは分速65mです。出発してから32分後にAとCが出会い、その5分後にBとCが出会いました。Cの速さと、この池の周りの長さを求めなさい。","sourceAnswer":"Cは分速95m、池は5920m","verification":"本文条件から作成者と検算者が別々に解き、資料の答えと一致を確認。"},"answer":{"parts":[{"label":"Cの速さ","n":"95","d":"1","unit":"m/分","dimension":"speed"},{"label":"池の周りの長さ","n":"5920","d":"1","unit":"m","dimension":"length"}]},"difficulty":4,"figureRequired":false,"scopeUnits":["R20"],"homeStudy":false,"reviewEligible":false,"expeditionOnly":true,"revision":1,"explanation":{"steps":[{"id":"s1","title":"条件を整理する","body":"AとCは逆向きに進むので、2人で合わせて1周進んだときに出会います。BとCも同じで、出会うまでに2人で1周進みます。","equation":"AとC：32分で1周、BとC：37分で1周"},{"id":"s2","title":"同じ1周を2通りに表す","body":"1周の長さは、Aの32分＋Cの32分であり、Bの37分＋Cの37分でもあります。","equation":"90×32＋C×32＝65×37＋C×37"},{"id":"s3","title":"ちがいからCの速さを出す","body":"90×32＝2880、65×37＝2405です。その差475mは、Cの5分ぶんにあたります。","equation":"（2880−2405）÷5＝95（m/分）"},{"id":"s4","title":"1周の長さを出す","body":"AとCは1分に90＋95＝185m近づき、32分で出会います。","equation":"185×32＝5920（m）"},{"id":"s5","title":"確かめる","body":"BとCは1分に65＋ するには、遅いBが60m走る時間に、Aが何m走れるかを考えます。Bの60mを基準にします。","equation":"Bの60m→Aは60×6÷5"},{"id":"s3","title":"Aが走れる道のり","body":"Bが60m走る間に、Aは速さの比の分だけ多く走ります。","equation":"60×6÷5＝72（m）"},{"id":"s4","title":"うしろに下げる道のり","body":"Aは72m走れるので、スタートラインより72−60m後ろから走ればよいです。","equation":"72−60＝12（m）"},{"id":"s5","title":"確かめる","body":"Aが72m、Bが60m走る時間の比は72÷6：60÷5＝12：12で同じになります。","equation":"72÷6＝60÷5＝12","checkpoint":{"prompt":"Bが60m走る間に、Aは何m走れますか。","answer":{"n":"72","d":"1","unit":"m","dimension":"length"}}}]},"selectionKey":"T10/speed.race.distance-handicap"},{"id":"ready-ab0194689ccb1a91","unitId":"selection.T10.speed.race.finish-gap-ratio","category":"oneline","domain":"速さ","text":"AとBが60mの競走をしたところ、Aがゴールに着いたとき、Bは10mうしろにいました。2人はこの速さで走るものとして、次の問いに答えなさい。\nAとBの速さの比を求めなさい。","source":{"title":"R20N⑥-3 1","url":"https://app.notion.com/3f42b010743c810c9c19e0606555308f","locator":"Notion 指定小問 1","sourceText":"AとBが60mの競走をしたところ、Aがゴールに着いたとき、Bは10mうしろにいました。2人はこの速さで走るものとして、次の問いに答えなさい。\n(1) AとBの速さの比を求めなさい。\n(2) 2人が同時にゴールに着くためには、Aはスタートラインの何mうしろから走り出せばよいですか。","sourceAnswer":"(1) 6：5　(2) 12m","verification":"本文条件から作成者と検算者が別々に解き、資料の答えと一致を確認。"},"answer":{"dimension":"ratio","terms":["6","5"],"unit":""},"difficulty":3,"figureRequired":false,"scopeUnits":["R20"],"homeStudy":false,"reviewEligible":false,"expeditionOnly":true,"revision":1,"explanation":{"steps":[{"id":"s1","title":"条件を整理する","body":"Aが60mのゴールに着いたとき、Bは10m後ろにいました。つまり同じ時間にBは50m走っています。","equation":"60−10＝50（m）"},{"id":"s2","title":"同じ時間なら道のりの比＝速さの比","body":"2人は同じ時間だけ走っているので、走った道のりの比がそのまま速さの比になります。","equation":"A：B＝60：50"},{"id":"s3","title":"最も簡単な比にする","body":"60と50を10で割ります。","equation":"60：50＝6：5"},{"id":"s4","title":"確かめる","body":"Aの速さを6、Bの速さを5とすると、Aが60m走る時間でBは60×5÷6＝50m走ります。","equation":"60×5÷6＝50","checkpoint":{"prompt":"Aがゴールに着いたとき、Bは何m走っていましたか。","answer":{"n":"50","d":"1","unit":"m","dimension":"length"}}}]},"selectionKey":"T10/speed.race.finish-gap-ratio"},{"id":"ready-59e848f2dca8e8b7","unitId":"selection.T11.speed.ratio.product-and-quotient", 743c810faa55fec254b4b6ae","locator":"Notion 全体","sourceText":"うさぎとかめが山のふもとから頂上まで競走しました。うさぎは時速2.4km、かめは時速0.4kmの速さで同時に出発しました。かめは始めから終わりまで休まず同じ速さで進みました。うさぎはふもとから0.6kmはなれた一本松で2時間45分ねむってしまいました。うさぎが目をさましたとき、ちょうどかめが頂上に着いたところでした。うさぎとかめが同時に頂上に着くためには、うさぎは何時間ねむればよいですか。目をさましてからも、時速2.4kmで進みます。","sourceAnswer":"2.5時間","verification":"本文条件から作成者と検算者が別々に解き、資料の答えと一致を確認。"},"answer":{"n":"5","d":"2","unit":"時間","dimension":"time"},"difficulty":3,"figureRequired":false,"scopeUnits":["GW428"],"homeStudy":false,"reviewEligible":false,"expeditionOnly":true,"revision":1,"explanation":{"steps":[{"id":"s1","title":"条件を整理する","body":"うさぎは0.6km先の一本松まで走ってから2時間45分ねむり、目をさましたとき、かめが頂上に着きました。","equation":"0.6÷2.4＝0.25（時間）"},{"id":"s2","title":"かめの時間から全体を出す","body":"うさぎが目をさましたのは出発から0.25＋2.75＝3時間後で、かめはちょうど3時間で頂上に着きました。","equation":"0.4×3＝1.2（km）"},{"id":"s3","title":"うさぎが走るのに必要な時間","body":"うさぎは頂上までの1.2kmを時速2.4kmで走ります。走るだけなら必要な時間はこれだけです。","equation":"1.2÷2.4＝0.5（時間）"},{"id":"s4","title":"同時に着くためのねむる時間","body":"かめが頂上に着く3時間のうち、走る0.5時間以外はねむってよいことになります。","equation":"3−0.5＝2.5（時間）"},{"id":"s5","title":"確かめる","body":"うさぎは0.25時間走り、2.5時間ねむり、残り0.6kmを0.25時間で走って、合計3時間で頂上に着きます。","equation":"0.25＋2.5＋0.25＝3","checkpoint":{"prompt":"山のふもとから頂上までは何kmですか。","answer":{"n":"6","d":"5","unit":"km","dimension":"length"}}}]},"selectionKey":"T12/speed.rest-counterfactual"},{"id":"ready-5b4f3d74f302412d","unitId":"selection.T12.speed.rest-interval.overlap","category":"oneline","domain":"速さ","text":"A地点とB地点をむすぶ4800mのハイキングコースがあります。コースのとちゅう、A地点から1800mはなれたところに展望台があります。ケンタ君は8時にA地点を出発し、とちゅう、展望台で30分休んだあと、ふたたび歩いてB地点に着きました。ミドリさんも8時にB地点を出発し、とちゅう、展望台で46分休んだあと、ふたたび歩いてA地点に着きました。ケンタ君がB地点に着いたのと、ミドリさんがA地点に着いたのは同時でした。ケンタ君の歩く速さはいつも分速60mで、ミドリさんもいつも同じ速さで歩きました。\n「B町から展望台までは3000mよ。」\n(1) ケンタ君がB地点に着いたのは何時何分ですか。\n(2) ミドリさんの歩く速さは分速何mですか。\n(3) 2人がいっしょに展望台にいた時間は何分間ですか。\n【答えるのは(3)だけです】","source":{"title":"GW428-23② 3","url":"https://app.notion.com/3f42b010743c812891fae0fce59069b5","locator":"Notion 指定小問 3","sourceText":"A地点とB地点をむすぶ4800mのハイキングコースがあります。コースのと ,"to":"ratio.chain_with_average","relation":"extension","difference":"全体と2数比が直接与えられる形から、平均を合計へ直し連続する3数比を組み立てる。"},{"from":"speed.total_with_rest","to":"speed.average_roundtrip","relation":"contrast","difference":"移動と休憩の総時間を答える形から、総距離を移動時間で割って平均速度を求める。"},{"from":"speed.arrival_difference","to":"speed.infer_phase_time","relation":"contrast","difference":"同じ距離の2通りの総時間差から距離を出す形と、1回の移動で速さが変わり合計から区間時間を出す形を区別する。"},{"from":"speed.bridge_clearance","to":"speed.two_trains_opposite","relation":"extension","difference":"固定された橋の長さと列車長から、動く2列車の長さ和・速度和を使う相対運動へ広げる。"},{"from":"speed.midpoint_offset","to":"speed.three_people_meeting_gap","relation":"contrast","difference":"同時出会いの道のり差から共通時間を出す形から、異なる2組の出会い時刻差を結ぶ。"}],"catalog":{"source":{"url":"https://raw.githubusercontent.com/takefumi5813/sansu/main/index.html","retrieved":"2026-10-11","snapshot":"legacy-index.html","migration":"User ownership is not imported. Original hero IDs retained. Legacy equipment keys are Japanese domain names; pilot IDs are explicitly mapped."},"heroes":[{"id":"arthur","name":"アーサー王","icon":"🗡️","description":"岩に刺さった剣を抜いてブリテンの王になったという伝説の騎士王。円卓の騎士をひきいた。"},{"id":"gilgamesh","name":"ギルガメシュ","icon":"👑","description":"世界最古の物語『ギルガメシュ叙事詩』の主人公。ウルクの王で、不老不死の草を探す旅に出た。"},{"id":"alexander","name":"アレクサンドロス大王","icon":"🐎","description":"愛馬ブケファラスとともに、ギリシャからインドの手前まで10年あまりで遠征した。"},{"id":"nobunaga","name":"織田信長","icon":"🔥","description":"楽市楽座で商売を自由にし、長篠の戦いでは鉄砲を大量に使った戦国武将。"},{"id":"yoshitsune","name":"源義経","icon":"🏯","description":"一ノ谷では崖をかけ下り（鵯越）、壇ノ浦では船から船へ飛び移った（八艘飛び）と伝わる。"},{"id":"jeanne","name":"ジャンヌ・ダルク","icon":"🚩","description":"17歳でフランス軍の先頭に立ち、包囲されたオルレアンを救った「オルレアンの乙女」。"},{"id":"heracles","name":"ヘラクレス","icon":"🦁","description":"ギリシャ神話最大の英雄。ライオン退治など「12の難業」をすべてやりとげた。"},{"id":"kongming","name":"諸葛孔明","icon":"🪶","description":"三国志の天才軍師。「天下三分の計」を説き、赤壁の戦いでは風を読んだと語られる。"},{"id":"davinci","name":"レオナルド・ダ・ヴィンチ","icon":"🖌️","description":"『モナ・リザ』を描き、空飛ぶ機械や水の流れの研究もした万能の天才。"},{"id":"napoleon","name":"ナポレオン","icon":"🎖️","description":"フランス皇帝。「余の辞書に不可能の文字はない」の言葉で知られる。"},{"id":"musashi","name":"宮本武蔵","icon":"⚔️","description":"二刀流「二天一流」の剣豪。巌流島で佐々木小次郎と戦った。『五輪書』を書いた。"},{"id":"kojiro","name":"佐々木小次郎","icon":"🌙","description":"長い刀「物干し竿」と、ツバメを斬るという「燕返し」の伝説で知られる剣士。"},{"id":"okita","name":"沖田総司","icon":"🌸","description":"新選組一番隊の組長。目にもとまらぬ「三段突き」の使い手と伝わる。"},{"id":"hijikata","name":"土方歳三","icon":"🛡️","description":"新選組の副長。きびしい隊のきまりを作り、最後まで戦いぬいた「鬼の副長」。"},{"id":"hannibal","name":"ハンニバル","icon":"🐘","description":"カルタゴの将軍。ゾウをつれて雪のアルプス山脈をこえ、ローマへ攻めこんだ。"},{"id":"cleopatra","name":"クレオパトラ","icon":"🐍","description":"古代エジプト最後の女王。何か国語も話し、外交でエジプトを守ろうとした。"},{"id":"himiko","name":"卑弥呼","icon":"🔮","description":"邪馬台国の女王。うらないで国を治めたと中国の歴史書『魏志』倭人伝に書かれている。"},{"id":"shotoku","name":"聖徳太子","icon":"📜","description":"十七条の憲法や冠位十二階を定めた。10人の話を一度に聞き分けたという伝説がある。"},{"id":"seimei","name":"安倍晴明","icon":"☯️","description":"平安時代の陰陽師。星の動きや暦を読み、こよみ作りにかかわった。"},{"id":"ryoma","name":"坂本龍馬","icon":"⚓","description":"仲の悪かった薩摩と長州を結びつけた（薩長同盟）。日本初の会社のような「亀山社中」を作った。"},{"id":"tell","name":"ウィリアム・テル","icon":"🍎","description":"息子の頭の上のリンゴを矢で射ぬいたというスイスの伝説の弓の名人。"},{"id":"robin","name":"ロビン・フッド","icon":"🏹","description":"シャーウッドの森にすみ、弱い人を助けたというイギリスの伝説の弓の名人。"},{"id":"kintoki","name":"坂田金時","icon":"🐻","description":"昔話「金太郎」のモデル。クマとすもうをとった怪力の少年で、のちに源頼光の家来になった。"},{"id":"tomoe","name":"巴御前","icon":"🏇","description":"木曽義仲にしたがって戦った女武者。弓も馬もすぐれていたと『平家物語』にある。"},{"id":"kanu","name":"関羽","icon":"🐉","description":"三国志の武将。長いひげと「青龍偃月刀」で知られ、のちに神としてまつられた。"},{"id":"momotaro","name":"桃太郎","icon":"🍑","description":"イヌ・サル・キジを仲間にして鬼ヶ島へ向かった昔話の主人公。"},{"id":"urashima","name":"浦島太郎","icon":"🐢","description":"助けたカメにつれられて竜宮城へ。帰ると長い年月がたっていた昔話の主人公。"},{"id":"kaguya","name":"かぐや姫","icon":"🎋","description":"竹の中から生まれ、5人の求婚者に難題を出して、月へ帰った『竹取物語』の姫。"},{"id":"toyotomi","name":"豊臣秀吉","icon":"🌅","description":"農民の子から天下人にのぼりつめた。太閤検地で全国の田畑の広さを同じ物差しではかり直し、収穫量（石高）を数字で調べた。"},{"id":"sanada","name":"真田幸村","icon":"🔴","description":"大坂の陣で、徳川家康の本陣に何度も突撃し、「日本一の兵」とたたえられたと伝わる。本名は信繁。赤い鎧の「赤備え」で知られる。"},{"id":"goku","name":"孫悟空","icon":"🐵","description":"『西遊記』の主人公。きん斗雲に乗れば一飛びで十万八千里、如意棒は自在にのび縮みする。三蔵法師のお供で天竺をめざした。"},{"id":"tokugawa","name":"徳川家康","icon":"🐦","description":"江戸幕府をひらき、260年あまり続く平和な時代の土台をつくった。じっくり待つのが得意な「たぬき」とよばれた。"},{"id":"shihuang","name":"始皇帝","icon":"🐲","description":"中国をはじめて統一した皇帝。長さ・重さ・ますの大きさ（度量衡）や文字、車輪のはばまでそろえた。万里の長城や兵馬俑でも知られる。"},{"id":"takeda","name":"武田信玄","icon":"⛰️","description":"甲斐の戦国大名。「疾きこと風の如く、徐かなること林の如く…」の「風林火山」の旗をかかげた。川の水を防ぐ信玄堤をつくったとも伝わる。"},{"id":"uesugi","name":"上杉謙信","icon":"🏔️","description":"越後（いまの新潟県）の戦国大名。「越後の龍」とよばれ、義を大切にしたといわれる。武田信玄と川中島で何度も戦った。"},{"id":"murasaki","name":"紫式部","icon":"📖","description":"平安時代に、世界でもっとも古い長編小説のひとつ『源氏物語』を書いた。全部で五十四帖もある大作。"},{"id":"hokusai","name":"葛飾北斎","icon":"🎨","description":"『富嶽三十六景』の「神奈川沖浪裏」（大きな波の絵）で世界的に有名な浮世絵師。90年ちかい生涯で何万枚もの絵をかいた。"},{"id":"pythagoras","name":"ピタゴラス","icon":"📏","description":"直角三角形の3辺の関係「三平方の定理（ピタゴラスの定理）」で名高い古代ギリシャの数学者。「万物は数である」と考えた。"},{"id":"kukai","name":"空海","icon":"🪷","description":"唐（中国）で仏教を学び、日本に真言宗を伝えた。高野山をひらき、讃岐の満濃池の大工事を指導したとも伝わる。"},{"id":"seishonagon","name":"清少納言","icon":"🍂","description":"『枕草子』で「春はあけぼの」と書き出した、平安時代の宮廷の女性。身のまわりのものを鋭く観察して書いた。"},{"id":"euclid","name":"ユークリッド","icon":"🔺","description":"『原論』という本で、図形の性質をいくつかの決まりから順に証明していく方法をまとめた。2000年以上、図形の教科書として読まれた。"},{"id":"issun","name":"一寸法師","icon":"🥢","description":"身長が一寸（約3cm）しかないのに、お椀の舟とはしのかいで都へ上り、針の刀で鬼を退治した昔話の主人公。"},{"id":"ikkyu","name":"一休さん","icon":"🧘","description":"室町時代の僧・一休宗純がモデル。「このはし（橋）わたるべからず」の立て札を見て、橋のはしではなく真ん中を渡った、などのとんち話で知られる。"},{"id":"genghis","name":"チンギス・ハーン","icon":"🐎","description":"モンゴル帝国を築いた人物。遊牧民の諸部族をまとめた。"},{"id":"lancelot","name":"ランスロット","icon":"🗡️","description":"アーサー王の物語に登場する、円卓の騎士の一人。"},{"id":"caesar","name":"カエサル","icon":"🏛️","description":"古代ローマの政治家・軍人。ガリア遠征を指揮した。"},{"id":"yamato","name":"日本武尊","icon":"⚔️","description":"『古事記』『日本書紀』に登場する伝説の人物。ヤマトタケルとも呼ばれる。"},{"id":"augustus","name":"アウグストゥス","icon":"👑","description":"古代ローマの初代皇帝。オクタウィアヌスとも呼ばれる。"},{"id":"taigong","name":"太公望","icon":"📜","description":"周の武王を助     if(canUp)$('#related-up').onclick=()=>startProblem(canUp,'normal',session.chainIndex+1);
    $('#answer-result').scrollIntoView({block:'nearest',behavior:'smooth'});
    if(r.equipmentLottery&&!r.duplicate&&!session.treasureShown){session.treasureShown=true;setTimeout(()=>playTreasure(r.equipmentLottery),700);}
  }
  function renderVisual(visual){
    if(!visual)return '';
    if(visual.kind==='image'&&visual.src)return `<img src="${esc(visual.src)}" alt="${esc(visual.alt||'解説図')}" style="width:100%;max-height:330px;object-fit:contain">`;
    // Text/equations remain authoritative; only approved built-in diagrams are rendered.
    if(visual.kind==='opposing-motion'||visual.kind==='meeting')return `<svg viewBox="0 0 460 140" role="img" aria-label="両側から進むと間隔が縮まる"><path d="M45 85H415" stroke="#b5c9ba" stroke-width="3"/><path d="M45 85H155l-10-8m10 8l-10 8M415 85H305l10-8m-10 8l10 8" fill="none" stroke="#19545b" stroke-width="4"/><circle cx="45" cy="85" r="9" fill="#19545b"/><circle cx="415" cy="85" r="9" fill="#bd8939"/><text x="100" y="55" text-anchor="middle" fill="#203c42" font-size="15">左から進む距離</text><text x="360" y="55" text-anchor="middle" fill="#203c42" font-size="15">右から進む距離</text><text x="230" y="125" text-anchor="middle" fill="#203c42" font-size="15">二つの分だけ、間隔が縮まる</text></svg>`;
    return '';
  }
  function renderExplanation(){
    disposeCanvases();const p=effectiveProblem(),steps=p.explanation.steps,step=steps[session.step];
    if(!step){toast('この教材の解説は未整備です。');renderQuestion();return;}
    app.innerHTML=`<div class="learning-head"><span class="pill">${esc(byUnit[p.unitId]?.name||'考え方の確認')}</span><button id="finish-session" class="quiet">今日はここまで</button></div><div class="learning-grid"><div class="review-left">${questionPaper(p,true)}${scratchMarkup(true)}</div><article class="explanation-card"><div class="step-top"><span>考え方 ${session.step+1}／${steps.length}</span><span class="step-dots">${steps.map((_,i)=>`<i class="${i<=session.step?'done':''}"></i>`).join('')}</span></div><h2>${esc(step.title)}</h2><p class="body">${esc(step.body)}</p>${renderVisual(step.visual)?`<div class="visual">${renderVisual(step.visual)}</div>`:''}${step.equation?`<div class="equation">${esc(step.equation)}</div>`:''}${step.checkpoint?`<div class="checkpoint"><p>${esc(step.checkpoint.prompt)}</p><input id="checkpoint-answer" type="text" inputmode="decimal" aria-label="考え方の確認解答"><span> ${esc(step.checkpoint.answer.unit)}</span> <button id="checkpoint-submit" class="primary">確かめる</button><p class="cp-message" id="checkpoint-message"></p></div>`:''}${session.step===steps.length-1&&p.answer?`<div class="answer-reveal"><span>答え</span><strong>${esc(C.formatAnswer(p.answer))}</strong></div>`:''}<div class="step-nav"><button id="step-prev" class="quiet" ${session.step===0?'disabled':''}>前の説明</button><button id="step-next" class="primary">${session.step===steps.length-1?'説明を終える':'次の説明 →'}</button></div><div id="variant-panel"></div></article></div>`;
    bindPaper();bindScratch();$('#finish-session').onclick=finish;
    $('#step-prev').onclick=()=>{session.step--;renderExplanation();};
    $('#step-next').onclick=()=>{if(session.step<steps.length-1){session.step++;renderExplanation();}else renderExplanationEnd();};
    if(step.checkpoint)$('#checkpoint-submit').onclick=async()=>{
      if(!checkDay())return;const active=session,stepIndex=active.step;
      const g=C.grade($('#checkpoint-answer').value,step.checkpoint.answer);
      if(!g.valid){$('#checkpoint-message').textContent=g.error;return;}
      if(!g.correct){$('#checkpoint-message').textContent='式と図をもう一度見比べてみよう。';return;}
      session.checkpointPassed=true;
      let response;
      if(active.purpose==='normal'&&active.result&&(!active.result.correct||active.assisted||!active.result.qualified)) await enqueue(s=>{response=C.completeLearning(s,active.problem,{attemptId:active.id,day:active.day,checkpointId:step.checkpoint.id||step.id});return response.state;});
      if(!currentSession(active)||view!=='explanation'||active.step!==stepIndex)return;
      $('#checkpoint-message').textContent=`合っています。${equipmentLotteryText(response?.result.equipmentLottery)}${response?.result.equipmentBoxes&&!response?.result.equipmentLottery?'装備箱＋'+response.result.equipmentBoxes+'。':''}${response?.result.materials?`鍛造素材＋${response.result.materials}。理解を記録しました。`:response?.result.souls?`英雄の魂＋${response.result.souls}。理解を記録しました。`:''}`;
      if(response?.result.equipmentLottery&&!active.treasureShown){active.treasureShown=true;setTimeout(()=>playTreasure(response.result.equipmentLottery),600);}
      if(session.step===steps.length-1)renderExplanationEnd();
    };
  }
  function renderExplanationEnd(){
    const p=session.problem,allowed=session.purpose==='normal'&&(!session.result.correct||session.assisted||!session.result.qualified)&&session.checkpointPassed&&p.variant&&!state.attempts.some(a=>a.unitId===p.unitId&&a.day===today()&&a.purpose==='variant');
    $('#variant-panel').innerHTML=`<div class="result-card" style="padding:18px"><h3>考え方を確かめました。</h3><p>${allowed?'数値を変えた1問で、使えるか試せます。経験値と復習回数は増えません。':'今日はここまでで大丈夫。日を空けた復習につなげましょう。'}</p><div class="result-actions">${allowed?'<button id="variant-start" class="gold-btn">数値替えに挑戦</button>':''}<button id="explanation-finish" class="primary">今日はここまで</button></div></div>`;
    $('#explanation-finish').onclick=finish;if(allowed)$('#variant-start').onclick=()=>startProblem(p,'variant');
  }
  async function finish(){
    const active=session;persistInk();view='finishing';await writeQueue.catch(()=>{});if(session!==active||view!=='finishing')return;disposeCanvases();view='finish';
    app.innerHTML=`<section class="finish-card"><div class="finish-icon">✦</div><div class="eyebrow">A SMALL STEP, A LASTING DISCOVERY</div><h1>今日の学びを、明日の力に。</h1><p>${dailyCounts().calc>=5&&dailyCounts().quest>=2?'今日の任務をすべて達成しました。':'今日の修練を記録しました。'}<br>${storageBroken?'保存できていない記録があります。書き出してから画面を閉じてください。':'記録と下書きは、この端末に保存しています。'}</p><p>累計 ${state.xp}pt · Lv.${C.level(state.xp)}</p><div class="resource-wallet">${resources()}</div><p class="caption">鍛冶師の修練 ${Math.min(dailyCounts().calc,5)} / 5 · 英雄との契約 ${Math.min(dailyCounts().quest,2)} / 2</p><button id="return-home" class="primary">ホームへ戻る</button>${storageBroken?'<button id="finish-export" class="quiet">記録を書き出す</button>':''}</section>`;
    $('#return-home').onclick=renderHome;if($('#finish-export'))$('#finish-export').onclick=exportRecords;
  }
  function inventoryHtml(){return `<h3>英雄 ${activeHeroCount()}／${DATA.catalog.heroes.length}</h3><p>全英雄が最初から召喚候補です。</p><h3>装備 ${activeEquipmentCount()}／${DATA.catalog.equipment.length}</h3><p>旅立ちの短剣で冒険を始め、装備箱で新しい装備を発見します。</p>${forgeHtml()}`;}
  function exportRecords(){const payload={application:'sansu-pilot',schemaVersion:1,contentVersion:DATA.version,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`sansu-pilot-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
  function validateBackup(value){
    const s=value?.state?unlockInventory(value.state):null,object=x=>!!x&&typeof x==='object'&&!Array.isArray(x),strings=x=>Array.isArray(x)&&x.every(v=>typeof v==='string'),natural=x=>Number.isSafeInteger(x)&&x>=0,date=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!Number.isNaN(Date.parse(x));
    const reject=()=>{throw Error('記録の形式を確認できません。この試作版の正常なバックアップを選んでください。');};
    if(value?.application!=='sansu-pilot'||value.schemaVersion!==1||s?.schemaVersion!==1||!natural(s.xp)||!natural(s.stars)||!natural(s.materials)||!natural(s.souls)||!natural(s.heroEchoes)||!Array.isArray(s.attempts)||!['units','rewards','daily','drafts','inventory'].every(k=>object(s[k])))reject();
    if(s.bankPractice!==undefined){
      if(!object(s.bankPractice))reject();
      for(const [id,r] of Object.entries(s.bankPractice))if(!/^selected-[a-f0-9]{16}$/.test(id)||!object(r)||typeof r.answerText!=='string'||r.answerText.length>5000||!date(r.day)||(r.result!==undefined&&!['understood','retry'].includes(r.result)))reject();
    }
    if(JSON.stringify(value).length>15000000)throw Error('バックアップが大きすぎます');
    for(const key of ['heroes','equipment'])if(!strings(s.inventory[key]))reject();
    for(const u of Object.values(s.units))if(!object(u)||!natural(u.stage)||u.stage>4||!natural(u.highestStageEver)||u.highestStageEver>4||!(u.due===null||date(u.due))||!Array.isArray(u.awardedStages)||!u.awardedStages.every(n=>natural(n)&&n>=1&&n<=4))reject();
    for(const [day,d] of Object.entries(s.daily))if(!date(day)||!object(d)||!strings(d.completed)||!strings(d.calcPaid)||!natural(d.chainXp))reject();
    for(const r of Object.values(s.rewards))if(!object(r)||!natural(r.xp)||!natural(r.stars))reject();
    const ids=new Set();
    for(const a of s.attempts){if(!object(a)||typeof a.id!=='string'||ids.has(a.id)||!date(a.day)||typeof a.problemId!=='string'||typeof a.unitId!=='string'||!['calc','oneline','geometry'].includes(a.category)||!['normal','variant','practice'].includes(a.purpose)||typeof a.correct!=='boolean'||typeof a.assisted!=='boolean'||typeof a.completed!=='boolean'||!object(a.result)||typeof a.result.qualified!=='boolean')reject();ids.add(a.id);}
    for(const d of Object.values(s.drafts)){if(!object(d)||typeof d.problemId!=='string'||!date(d.day))reject();for(const key of ['ink','figureInk']){if(!Array.isArray(d[key]))reject();for(const stroke of d[key]){if(!object(stroke)||typeof stroke.color!=='string'||!/^#[0-9a-f]{6}$/i.test(stroke.color)||!Number.isFinite(stroke.width)||stroke.width<=0||stroke.width>50||!Array.isArray(stroke.points))reject();for(const p of stroke.points)if(!object(p)||!Number.isFinite(p.x)||!Number.isFinite(p.y))reject();}}}
    if(s.loadout&&(!object(s.loadout)||!(s.loadout.hero===null||typeof s.loadout.hero==='string')||!strings(s.loadout.equipment)||s.loadout.equipment.length>3||s.loadout.equipment.some(id=>!s.inventory.equipment.includes(id))||s.loadout.hero&&!s.inventory.heroes.includes(s.loadout.hero)))reject();
    if(!strings(s.heroExchangeOffers)||s.heroExchangeOffers.length>3||new Set(s.heroExchangeOffers).size!==s.heroExchangeOffers.length||s.heroExchangeOffers.some(id=>!DATA.catalog.heroes.some(h=>h.id===id)))reject();
    if(s.bondRuleVersion!==2||!object(s.heroBonds)||Object.entries(s.heroBonds).some(([id,n])=>!natural(n)||n>150||!s.inventory.heroes.includes(id)))reject();
    if(!natural(s.gearPity)||s.gearPity>9||!natural(s.heroSummons)||!natural(s.equipmentBoxes)||!natural(s.equipmentDiscoveries)||!object(s.equipmentTraining)||Object.entries(s.equipmentTraining).some(([id,n])=>!natural(n)||n<1||n>10||!s.inventory.equipment.includes(id)))reject();
    if(s.bonds&&(!object(s.bonds)||Object.values(s.bonds).some(n=>!natural(n))))reject();
    return s;
  }
  function openSettings(tab='settings'){
    const dialog=$('#settings-dialog');dialog.classList.remove('guild-dialog');$('.dialog-head h2').textContent='記録と設定';
    $('#settings-content').innerHTML=tab==='inventory'?`<div class="settings-section">${inventoryHtml()}</div>`:`<div class="settings-section"><h3>保護者の設定</h3><p>直近授業と次回グノレブの範囲を別々に設定します。直近授業は第24回、次回グノレブは既習の第24回を対象にしています。第25〜27回は未習のため含めていません。授業が進んだら変更してください。</p><label>学年 <select id="grade-setting"><option value="5" ${settings.grade===5?'selected':''}>5年生</option><option value="6" ${settings.grade===6?'selected':''}>6年生</option></select></label><p><label>直近授業の範囲（カンマ区切り）<br><input id="recent-scope" value="${esc(settings.recentUnits.join(','))}" style="width:100%"></label></p><p><label>次回グノレブの日 <input id="test-date" type="date" value="${esc(settings.testDate)}"></label></p><p><label>次回グノレブの範囲（カンマ区切り）<br><input id="test-scope" value="${esc(settings.scopeUnits.join(','))}" style="width:100%;padding:9px;border:1px solid #bdcdbf;border-radius:9px"></label></p><button id="save-preferences" class="primary">設定を保存</button></div><div class="settings-section"><h3>学習の記録</h3><p>${state.attempts.length}回の解答 · ${state.xp}pt · ${Object.values(state.drafts).length}件の下書き</p><button id="export-records" class="quiet">バックアップを書き出す</button><p><label>この試作のバックアップを読み込む<br><input id="import-records" type="file" accept="application/json,.json"></label></p><p id="import-message"></p><table class="history-table"><thead><tr><th>日付</th><th>教材</th><th>結果</th></tr></thead><tbody>${state.attempts.slice(-12).reverse().map(a=>`<tr><td>${esc(a.day)}</td><td>${esc(DATA.problems.find(p=>p.id===a.problemId)?.source.title||a.problemId)}</td><td>${a.correct?'○':'×'} ${a.assisted?'補助あり':''}</td></tr>`).join('')}</tbody></table></div><div class="settings-section"><h3>この試作の範囲</h3><p>段階解説・手書き・正確な数値判定・復習・報酬を確認するPhase Aです。下書きを外部へ送るAI機能はまだありません。公開もしていません。</p><button id="inventory-from-settings" class="quiet">英雄・装備の図鑑</button></div>`;
    if(!dialog.open)dialog.showModal();
    if(tab==='settings'){
      $('#save-preferences').onclick=()=>{settings.grade=Number($('#grade-setting').value);settings.testDate=$('#test-date').value;settings.recentUnits=$('#recent-scope').value.split(/[,、\s]+/).filter(Boolean);settings.scopeUnits=$('#test-scope').value.split(/[,、\s]+/).filter(Boolean);if(settings.grade===5&&settings.difficulty>8)settings.difficulty=8;rememberSettings();dialog.close();if(view==='home')renderHome();toast('範囲設定を保存しました。');};
      $('#export-records').onclick=exportRecords;
      $('#import-records').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>15000000)throw Error('ファイルが大きすぎます');const imported=validateBackup(JSON.parse(await file.text()));$('#import-message').textContent='この端末の試作記録を置き換えます。';const button=document.createElement('button');button.className='primary';button.textContent='確認して読み込む';button.onclick=async()=>{await enqueue(()=>clone(imported));dialog.close();renderHome();toast('バックアップを読み込みました。');};$('#import-message').append(button);}catch(err){$('#import-message').textContent=err.message;}};
      $('#inventory-from-settings').onclick=()=>openGuild('collection');
    }
  }
  $('#records-open').onclick=()=>openSettings();$('#settings-close').onclick=()=>$('#settings-dialog').close();
  $('#brand').onclick=e=>{e.preventDefault();if(session&&view!=='home')finish();else renderHome();};
  window.addEventListener('pagehide',()=>{persistInk();});
  app.innerHTML='<p class="loading">今日の学びを準備しています…</p>';
  try{state=unlockInventory(validateBackup({application:'sansu-pilot',schemaVersion:1,state:await storage.load()}));}catch(e){failSave(e);}
  syncHeader();renderHome();
  const enter=$('#begin-adventure');
  $('#opening-record').textContent=state.attempts.length?'Lv.'+C.level(state.xp)+' · これまでの歩みを、次の一歩へ。':'小さなひらめきから、冒険がはじまる。';
  enter.disabled=false;
  enter.onclick=()=>{document.body.dataset.screen='home';$('#opening').hidden=true;window.scrollTo({top:0});$('#start')?.focus({preventScroll:true});};
  window.SansuPilot={snapshot:()=>clone(state),data:DATA,storageName:'sansu-pilot-v1',whenSaved:()=>writeQueue};
})();
</script>
